[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crop_embed"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "peft",
    "pyfaidx",
    "pysam",
    "scikit-learn",
    "scipy",
    "torch",
    "transformers",
]

# PlantCAD (Caduceus / Mamba) backbone — opt-in extra. Upstream pins
# torch==2.3.1+cu121 / triton==2.3.1 / mamba-ssm==2.2.2; install into a
# dedicated env to avoid clashing with the DNABERT-2 stack. See
# PlantCAD_modules/loader.py for the runtime caveats.
[project.optional-dependencies]
plantcad = ["mamba-ssm"]

[tool.setuptools.packages.find]
where = ["."]
include = ["crop_embed*"]
