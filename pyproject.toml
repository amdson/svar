[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crop_embed"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "peft",
    "pyfaidx",
    "pysam",
    "scikit-learn",
    "scipy",
    "torch",
    "transformers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crop_embed*"]
